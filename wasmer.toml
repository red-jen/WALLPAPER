[package]
name = "red-jen/murart"
version = "0.1.0"
description = "MurArt - Laravel wallpaper ecommerce platform"

[[module]]
name = "murart"
source = "php/php:8.3"
abi = "wasi"

[module.interfaces]
wasi = "0.1.0-unstable"

[fs]
"/app" = "."

# Build/deploy hook - runs migrations non-interactively
[build]
command = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache"

# Main serve command
[command]
name = "serve"
module = "murart"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["-S", "0.0.0.0:8080", "-t", "/app/public"]
env = [
    "APP_ENV=production",
    "APP_DEBUG=false"
]

# Post-deploy hook (alternative/fallback if [build] doesn't work)
[[hooks]]
type = "post-deploy"
command = "php artisan migrate --force"
