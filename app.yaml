runtime: php
php_version: 8.3

env:
  APP_ENV: production
  APP_DEBUG: false

build:
  commands:
    - composer install --no-dev --optimize-autoloader
    - npm install && npm run build

# TEMPORARY: Using migrate:fresh to recover half-migrated Wasmer preview database
# After successful deploy, change back to: php artisan migrate --force --no-interaction
# migrate:fresh drops all tables and recreates them - necessary because free tier has no console
after_deploy:
  - php artisan migrate:fresh --force --no-interaction
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache

start:
  command: php -S 0.0.0.0:8080 -t public/
