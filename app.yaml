runtime: php
php_version: 8.3

env:
  APP_ENV: production
  APP_DEBUG: false

build:
  commands:
    - composer install --no-dev --optimize-autoloader
    - npm install && npm run build

# CRITICAL: Override Wasmer's default after_deploy which runs plain "php artisan migrate"
# Wasmer always injects after_deploy but we override it here to add --force flag
after_deploy:
  - php artisan migrate --force --no-interaction
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache

start:
  command: php -S 0.0.0.0:8080 -t public/
