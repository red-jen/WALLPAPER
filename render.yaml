services:
  # PostgreSQL Database
  - type: pserv
    name: murart-db
    plan: starter
    region: oregon
    ipAllowList: []
    databaseName: murart
    databaseUser: murart

  # Laravel Web Application
  - type: web
    name: murart-web
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: MurArt
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: murart-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: murart-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: murart-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: murart-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: murart-db
          property: password
      - key: DATABASE_URL
        fromDatabase:
          name: murart-db
          property: connectionString
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
    preDeployCommand: php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache
